# ==============================================================================
# IntelliTrace AI - Development Profile (application-dev.properties)
# ==============================================================================

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:intellitracedb_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & SQL Debugging
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Verbose application logging
logging.level.com.intellitrace=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
