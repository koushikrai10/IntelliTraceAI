# ==============================================================================
# IntelliTrace AI - Default Application Configuration (H2 In-Memory)
# ==============================================================================

spring.application.name=intellitrace-backend
server.port=8080

# Active Spring Profile (defaults to 'dev', can be set to 'h2-file' or 'mysql')
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:intellitracedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Limits (Max 50MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# IntelliTrace Custom Settings
intellitrace.upload.max-file-size=52428800
intellitrace.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

# External AI Configuration (Google Gemini REST API)
# Primary API key read from GEMINI_API_KEY environment variable.
# Fallback support for INTELLITRACE_AI_API_KEY if already set.
intellitrace.ai.api-key=${GEMINI_API_KEY:${INTELLITRACE_AI_API_KEY:}}
intellitrace.ai.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
intellitrace.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
intellitrace.ai.timeout-seconds=30
intellitrace.ai.temperature=0.2
intellitrace.ai.max-tokens=1024
intellitrace.ai.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.intellitrace=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
