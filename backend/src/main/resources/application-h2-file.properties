# ==============================================================================
# IntelliTrace AI - Persistent File-Based H2 Profile (application-h2-file.properties)
# ==============================================================================

# H2 File-Based Persistent Database Configuration
# Stores persistent database files in ./data/intellitracedb
spring.datasource.url=jdbc:h2:file:./data/intellitracedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration for Persistent H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.intellitrace=INFO
